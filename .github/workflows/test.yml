name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run regression (headless)
        env:
          GOMOKU_HEADLESS: "1"
          # Shared runners are slower and noisier; triple the wall-clock limits.
          GOMOKU_TIMING_SLACK: "3"
        run: python3 tests/gomoku.py
